<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#234d42" />
    <meta name="description" content="흑백 타일 사이에 숨은 숫자를 찾아보세요. 친구와 함께하는 2~4인 숫자 추리 게임." />
    <title>숫자 추리 게임</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=20261127-0321" />
  </head>
  <body>
    <main class="app">
      <header class="site-header">
        <div class="wordmark"><span class="brand-mark" aria-hidden="true"><i>?</i><i>7</i></span></div>
        <div class="header-tools"><button id="home-btn" class="motion-toggle home-btn hidden">← 처음으로</button><button id="sound-toggle" class="motion-toggle" aria-pressed="true">소리 켜짐</button><button id="motion-toggle" class="motion-toggle" aria-pressed="true">손 연출 켜짐</button></div>
      </header>
      <section id="home" class="screen home-screen login" aria-label="게임 시작">
        <div class="home-layout">
          <div class="intro">
            <div class="tile-scene" aria-hidden="true">
              <div class="owl-wrap">
                <svg class="owl" viewBox="0 0 120 124" aria-hidden="true">
                <!-- 꼬마 탐정 부엉이 -->
                <ellipse cx="58" cy="117" rx="30" ry="4" fill="#0e2a22" opacity=".35"/>
                <path d="M30 60 Q28 30 58 28 Q88 30 86 60 L86 92 Q86 114 58 114 Q30 114 30 92 Z" fill="#8a6a4b"/>
                <path d="M40 74 Q40 62 58 62 Q76 62 76 74 L76 94 Q76 108 58 108 Q40 108 40 94 Z" fill="#f2e7cf"/>
                <g fill="none" stroke="#c9b48e" stroke-width="2" stroke-linecap="round">
                  <path d="M50 80 q3 3 6 0"/><path d="M60 80 q3 3 6 0"/>
                  <path d="M47 89 q3 3 6 0"/><path d="M56 89 q3 3 6 0"/><path d="M65 89 q3 3 6 0"/>
                  <path d="M52 98 q3 3 6 0"/><path d="M61 98 q3 3 6 0"/>
                </g>
                <path d="M32 66 Q20 80 30 100 Q40 92 40 76 Z" fill="#6f5339"/>
                <path d="M47 112 l-3 6 M51 112 l0 6 M55 112 l3 6" stroke="#e39a45" stroke-width="3" stroke-linecap="round"/>
                <path d="M65 112 l-3 6 M69 112 l0 6 M73 112 l3 6" stroke="#e39a45" stroke-width="3" stroke-linecap="round"/>
                <circle cx="46" cy="50" r="13" fill="#fffaf0"/>
                <circle cx="70" cy="50" r="13" fill="#fffaf0"/>
                <g class="owl-eyes">
                  <circle cx="49" cy="53" r="6.5" fill="#1f2a24"/><circle cx="73" cy="53" r="6.5" fill="#1f2a24"/>
                  <circle cx="51" cy="50.5" r="2" fill="#fff"/><circle cx="75" cy="50.5" r="2" fill="#fff"/>
                </g>
                <g class="owl-lids" fill="#8a6a4b">
                  <rect x="32" y="36" width="28" height="28" rx="14"/><rect x="56" y="36" width="28" height="28" rx="14"/>
                </g>
                <path d="M54 58 L58 66 L62 58 Z" fill="#e39a45"/>
                <circle cx="38" cy="62" r="4" fill="#e8907a" opacity=".55"/>
                <circle cx="78" cy="62" r="4" fill="#e8907a" opacity=".55"/>
                <path d="M30 34 Q30 18 58 16 Q86 18 86 34 Q72 28 58 28 Q44 28 30 34 Z" fill="#c8603f"/>
                <path d="M26 35 Q58 22 90 35 Q58 31 26 35 Z" fill="#a84c30"/>
                <path d="M58 16 Q60 9 66 8" stroke="#a84c30" stroke-width="3" fill="none" stroke-linecap="round"/>
                <g class="owl-glass">
                  <path d="M84 70 Q98 66 100 82 Q92 88 82 82 Z" fill="#6f5339"/>
                  <line x1="96" y1="84" x2="104" y2="96" stroke="#5b4330" stroke-width="5" stroke-linecap="round"/>
                  <circle cx="92" cy="76" r="11" fill="#eaf7fb" fill-opacity=".9" stroke="#d6a94a" stroke-width="3.5"/>
                  <path d="M86 71 q3 -3 7 -2" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" opacity=".9"/>
                </g>
              </svg>
              <div class="scene-note">4? 5? 아니면 6?</div>
              </div>
              <div class="hero-tiles">
                <div class="tile light hero-first"><span>3</span><small>공개</small></div>
                <div class="tile dark back hero-mystery"><span class="mystery-symbol">?</span></div>
                <div class="tile light hero-third"><span class="u">6</span><small>공개</small></div>
                <div class="tile dark back hero-fourth"></div>
              </div>
              <div class="scene-rail"></div>
            </div>
          </div>
          <div class="entry-card">
            <label class="field" for="name">내 이름<input id="name" maxlength="8" placeholder="이름이나 별명" autocomplete="off" /></label>
            <div class="home-actions">
              <button id="create" class="primary" disabled>새 방 만들기</button>
              <div class="divider"><span>열려 있는 방</span></div>
              <ul id="room-list" class="room-list" aria-live="polite"><li class="room-empty">방 목록을 불러오는 중…</li></ul>
              <details id="code-join" class="code-join"><summary>방 번호로 들어가기</summary>
              <div class="join-row"><input id="code" aria-label="방 번호 4자리" inputmode="numeric" maxlength="4" placeholder="숫자 4자리" autocomplete="off" /><button id="join" disabled>들어가기</button></div>
              </details>
            </div>
            <p id="mode-badge" class="badge">게임을 준비하고 있어요…</p>
          </div>
        </div>
      </section>
      <section id="lobby" class="screen lobby-screen hidden" aria-label="대기실">
        <h1>친구를 기다리는 중</h1>
        <p class="sub">친구들에게 방 번호를 알려 주세요</p>
        <div class="rack code-rack"><div class="room-code hand" id="lobby-code" role="img"></div></div>
        <div class="lobby-paper"><div class="lobby-list-heading"><h2>참가자</h2><span>최대 4명</span></div><ul id="lobby-players" class="player-list"></ul><p id="lobby-hint" class="hint" role="status"></p><div class="row"><button id="start" class="primary hidden">게임 시작</button><button id="leave" class="quiet">나가기</button></div></div>
      </section>
      <section id="game" class="screen game-screen hidden" aria-label="게임판">
        <div class="game-topline"><div id="banner" class="banner" role="status"></div></div>
        <div id="opponents" class="opponents"></div>
        <div class="turn-area"><div class="middle"><div class="board"><div class="tray" id="tray" aria-hidden="true"></div><div class="pile-text"><span class="pile-label">남은 타일</span><span id="pile-count" class="pile-count"></span></div></div><div id="drawn-box" class="drawn-box"></div></div><div id="panel" class="panel"></div></div>
        <div class="me"><h2 id="my-title" class="seat-head"></h2><div class="rack"><div id="my-hand" class="hand"></div></div></div>
      </section>
      
      <p id="toast" class="toast hidden" role="status"></p>
      <div id="chat" class="chat hidden">
        <div id="chat-peek" class="chat-peek hidden" aria-hidden="true"></div>
        <section id="chat-panel" class="chat-panel hidden" aria-label="채팅">
          <div class="chat-head"><b>채팅</b><button id="chat-close" class="chat-close" aria-label="채팅 닫기">×</button></div>
          <ul id="chat-list" class="chat-list" aria-live="polite"></ul>
          <form id="chat-form" class="chat-form" autocomplete="off">
            <input id="chat-input" maxlength="60" placeholder="메시지 쓰기 (60자)" aria-label="채팅 메시지" />
            <button type="submit" class="chat-send">보내기</button>
          </form>
        </section>
        <button id="chat-toggle" class="chat-toggle" aria-expanded="false">💬 채팅<span id="chat-unread" class="chat-unread hidden"></span></button>
      </div>
    </main>
    <script>
      // 파일 직접 열기는 일반 스크립트, 웹 주소는 기존 모듈을 사용합니다.
      (() => {
        const script = document.createElement("script");
        const localFile = location.protocol === "file:";
        if (!localFile) script.type = "module";
        script.src = localFile ? "./local-preview.js" : "./app.js?v=20261127-0321";
        script.onerror = () => {
          const message = localFile
            ? "미리보기 파일을 읽지 못했어요. ZIP 압축을 모두 풀고 local-preview.js가 index.html과 같은 폴더에 있는지 확인해 주세요."
            : "게임 파일을 읽지 못했어요. app.js, game.js, net.js, motion.js, sound.js, firebase-config.js가 index.html과 같은 폴더에 업로드됐는지 확인해 주세요.";
          document.getElementById("mode-badge").textContent = message;
          const toast = document.getElementById("toast");
          toast.textContent = message;
          toast.classList.remove("hidden");
        };
        document.body.append(script);
      })();
    </script>
  </body>
</html>
