<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>명화 퀴즈</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <!-- 시작 화면 -->
    <section class="screen" id="home">
      <p class="eyebrow">가을 담은 명화 · 원작 만나기</p>
      <h1>명화 퀴즈</h1>
      <p class="lead">명화 9점, 얼마나 기억하고 있나요?</p>

      <button class="gallery-cta" id="open-gallery">
        <span class="cta-text">
          <span class="cta-title">🖼️ 명화 도감</span>
          <span class="cta-desc">퀴즈 전에 명화 9점을 먼저 살펴봐요</span>
        </span>
        <span class="cta-thumbs" id="cta-thumbs"></span>
      </button>

      <h2 class="home-sub">게임 고르기</h2>
      <div class="mode-row" id="mode-grid"></div>

      <button class="mix-card" data-mode="mix">
        <span class="mode-icon">🎨</span>
        <span class="mix-text">
          <span class="mode-name">종합 퀴즈</span>
          <span class="mode-desc">모든 유형이 섞인 10문제에 도전해요</span>
        </span>
      </button>
    </section>

    <!-- 이름 입력 화면 (종합 퀴즈) -->
    <section class="screen hidden" id="name-screen">
      <div class="quiz-top">
        <button class="ghost-btn" id="name-back">← 처음으로</button>
      </div>
      <form class="name-form" id="name-form" novalidate>
        <p class="eyebrow">🎨 종합 퀴즈</p>
        <h2 class="section-title">이름을 입력해 주세요</h2>
        <p class="lead">퀴즈가 끝나면 점수가 선생님께 전달돼요.</p>
        <label class="sr-only" for="player-name">이름</label>
        <input id="player-name" class="name-input" type="text" maxlength="20" autocomplete="off" placeholder="예: 3번 김하늘" />
        <p class="name-error hidden" id="name-error">이름을 입력해야 시작할 수 있어요.</p>
        <button class="primary-btn" type="submit">퀴즈 시작하기</button>
      </form>
    </section>

    <!-- 퀴즈 화면 -->
    <section class="screen hidden" id="quiz">
      <div class="quiz-top">
        <button class="ghost-btn" id="quit">← 처음으로</button>
        <span class="counter" id="counter">1 / 10</span>
        <span class="score-pill" id="score-pill">⭐ 0</span>
      </div>
      <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>

      <p class="q-type" id="q-type"></p>
      <h2 class="q-text" id="q-text"></h2>
      <div class="q-visual" id="q-visual"></div>
      <div class="choices" id="choices"></div>

      <div class="feedback hidden" id="feedback">
        <p class="fb-title" id="fb-title"></p>
        <div class="fb-card" id="fb-card"></div>
        <button class="primary-btn" id="next">다음 문제 →</button>
      </div>
    </section>

    <!-- 결과 화면 -->
    <section class="screen hidden" id="result">
      <p class="eyebrow">퀴즈 끝!</p>
      <div class="stars" id="stars"></div>
      <p class="player-line hidden" id="player-line"></p>
      <h2 class="result-score" id="result-score"></h2>
      <p class="lead" id="result-msg"></p>
      <p class="send-status hidden" id="send-status"></p>
      <div class="review" id="review"></div>
      <div class="result-actions">
        <button class="primary-btn" id="retry">한 번 더 하기</button>
        <button class="ghost-btn" id="home-btn">다른 퀴즈 고르기</button>
      </div>
    </section>

    <!-- 도감 화면 -->
    <section class="screen hidden" id="gallery">
      <div class="quiz-top">
        <button class="ghost-btn" id="gallery-back">← 처음으로</button>
      </div>
      <h2 class="section-title">명화 도감</h2>
      <p class="lead">그림을 누르면 작품 이야기를 볼 수 있어요.</p>
      <div class="gallery-grid" id="gallery-grid"></div>
    </section>

    <footer class="credit">원작 이미지: Wikimedia Commons / PD-Art, NGA Open Access / CC0</footer>
  </main>

  <dialog class="art-dialog" id="art-dialog">
    <div id="dialog-body"></div>
    <form method="dialog"><button class="primary-btn">닫기</button></form>
  </dialog>

  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
