<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>음식 이상형 월드컵</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>🍽️ 음식 이상형 월드컵</h1>
        <p id="status">16강 1 / 8</p>
      </header>

      <section class="match" id="match">
        <button class="food-card" id="left-card" aria-label="왼쪽 음식 선택"></button>
        <span class="vs">VS</span>
        <button class="food-card" id="right-card" aria-label="오른쪽 음식 선택"></button>
      </section>

      <section class="controls">
        <button id="restart">처음부터 다시하기</button>
      </section>

      <section class="result hidden" id="result"></section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
