<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>음식 이상형 월드컵</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>🍽️ 음식 이상형 월드컵</h1>
        <p id="status">16강 1 / 8</p>
      </header>

      <section class="match" id="match">
        <button class="food-card" id="left-card" aria-label="왼쪽 음식 선택">
          <img class="food-image" src="" alt="" />
          <span class="food-name"></span>
        </button>
        <span class="vs">VS</span>
        <button class="food-card" id="right-card" aria-label="오른쪽 음식 선택">
          <img class="food-image" src="" alt="" />
          <span class="food-name"></span>
        </button>
      </section>

      <section class="controls">
        <button id="restart">처음부터 다시하기</button>
      </section>

      <section class="result hidden" id="result"></section>

      <section class="history" id="history">
        <h2>📚 라운드별 승자 기록</h2>
        <p class="history-empty" id="history-empty">아직 완료된 라운드가 없어요.</p>
        <div id="history-list"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
