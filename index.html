<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>블록 월드 - 마인크래프트 스타일 게임</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="game-canvas"></canvas>

    <div id="crosshair"></div>

    <div id="hotbar"></div>

    <div id="hud">
      <div id="pos-display"></div>
    </div>

    <div id="overlay">
      <div class="panel">
        <h1>⛏️ 블록 월드</h1>
        <p class="subtitle">Three.js로 만든 마인크래프트 스타일 미니 게임</p>
        <ul class="controls-list">
          <li><b>WASD</b> 이동</li>
          <li><b>마우스</b> 시점 회전</li>
          <li><b>Space</b> 점프</li>
          <li><b>Shift</b> 달리기</li>
          <li><b>좌클릭</b> 블록 부수기</li>
          <li><b>우클릭</b> 블록 놓기</li>
          <li><b>1~6 / 휠</b> 블록 선택</li>
          <li><b>Esc</b> 일시정지</li>
        </ul>
        <button id="start-button">클릭해서 시작하기</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
